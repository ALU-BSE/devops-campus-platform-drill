# Ansible reads this automatically when you run from inside this directory.
# NOTE: ini values do not support trailing comments -- put comments on their own line.

[defaults]
# Where the hosts come from. This file is GENERATED from `terraform output`
# by scripts/verify_infra.py. Do not hand-edit it.
inventory = inventory.ini

# A brand-new box has a brand-new host key, and you will rebuild it often.
host_key_checking = False

interpreter_python = /usr/bin/python3

# Readable output. You are going to be reading a lot of it.
stdout_callback = default
callback_result_format = yaml

force_color = True

[ssh_connection]
# Fewer SSH round-trips per task. Noticeably faster over a slow link.
pipelining = True
